<title>Make-Ready Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: navy header band with greeting + stats; views below as card lists. Phone: bottom tab bar + floating add button + day picker; desktop: tabs in header + 5-day board. */
:root {
  --bg: #f2f4f9; --surface: #ffffff; --surface-2: #f6f7fb; --ink: #111a2e; --muted: #667089; --line: #e2e6ef;
  --band: #14254a; --band-ink: #ffffff; --band-muted: #a9b6d6; --band-chip: rgba(255,255,255,.1);
  --accent: #ff6b2c; --accent-ink: #ffffff; --focus: #2f6bff;
  --shadow: 0 1px 2px rgba(17,26,46,.06), 0 4px 14px rgba(17,26,46,.06);
  --t-turnover: #8a5a2b; --t-paint: #2f6bff; --t-reglaze: #0aa3a3; --t-carpet_replace: #8b4fd8; --t-carpet_clean: #2e9e4f; --t-inspection: #d98a00;
  --ok: #1f9d55; --warn: #d97706; --bad: #e0393e; --info: #2f6bff; --idle: #7a849c;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1120; --surface: #151d31; --surface-2: #1b2540; --ink: #e8ecf6; --muted: #98a3bf; --line: #26314d;
  --band: #18264a; --band-ink: #ffffff; --band-muted: #a9b6d6; --band-chip: rgba(255,255,255,.08);
  --accent: #ff8048; --accent-ink: #1b0b02; --focus: #7ea2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --t-turnover: #d29a62; --t-paint: #6f99ff; --t-reglaze: #35c9c9; --t-carpet_replace: #b48af0; --t-carpet_clean: #5cc97c; --t-inspection: #f2b33d;
  --ok: #4cc97f; --warn: #f2a33d; --bad: #ff6b6f; --info: #6f99ff; --idle: #98a3bf; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #151d31; --surface-2: #1b2540; --ink: #e8ecf6; --muted: #98a3bf; --line: #26314d;
  --band: #18264a; --band-ink: #ffffff; --band-muted: #a9b6d6; --band-chip: rgba(255,255,255,.08);
  --accent: #ff8048; --accent-ink: #1b0b02; --focus: #7ea2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --t-turnover: #d29a62; --t-paint: #6f99ff; --t-reglaze: #35c9c9; --t-carpet_replace: #b48af0; --t-carpet_clean: #5cc97c; --t-inspection: #f2b33d;
  --ok: #4cc97f; --warn: #f2a33d; --bad: #ff6b6f; --info: #6f99ff; --idle: #98a3bf; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin: 0 auto; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header band */
.band { background: var(--band); color: var(--band-ink); }
.band .wrap { padding-block: 18px 20px; display: grid; gap: 16px; }
.brandrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.logo svg.i { width: 22px; height: 22px; stroke-width: 2.2; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--band-muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--band-chip); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-size: 28px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--band-muted); font-weight: 600; }
.stat.alert b { color: #ff8a8d; } .stat.warnc b { color: #ffc069; }

/* navigation: header tabs on desktop, bottom bar on phones */
.nav { display: flex; gap: 6px; margin-left: auto; }
.nav button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--band-muted); font: 700 14px var(--font); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.nav button[aria-selected="true"] { background: var(--band-chip); color: var(--band-ink); }
.nav button:hover { color: var(--band-ink); }

main { padding-block: 20px 56px; display: grid; gap: 22px; }
.sechead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sechead h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; flex: 1; text-wrap: balance; }
.sechead .count { color: var(--muted); font-weight: 600; font-size: 14px; }

button, .btn { font: 700 14px var(--font); cursor: pointer; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button.danger { color: var(--bad); }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.iconbtn { width: 42px; padding: 0; }

/* job cards */
.jobs { display: grid; gap: 10px; }
.job { width: 100%; text-align: left; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font: inherit; cursor: pointer; min-height: 0; }
.job:hover { border-color: var(--tc); }
.ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.ico svg.i { width: 22px; height: 22px; }
.jb { display: grid; gap: 1px; min-width: 0; }
.jt { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.jt small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.js { font-size: 13.5px; font-weight: 700; color: var(--tc); }
.jm { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.job.done { opacity: .62; box-shadow: none; }
.job.done .jt { text-decoration: line-through; }
.job.issue { border-color: var(--bad); }

.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); }
.s-scheduled { --sc: var(--idle); } .s-in_progress { --sc: var(--info); } .s-done { --sc: var(--ok); } .s-issue { --sc: var(--bad); } .s-late { --sc: var(--warn); }

.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px; text-align: center; color: var(--muted); font-weight: 600; }
.empty b { color: var(--ink); }

/* week */
.weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.weekbar h2 { margin: 0; font-size: 19px; font-weight: 800; flex: 1; min-width: 160px; }
.weekbar select { width: auto; max-width: 100%; }
.daypick { display: none; gap: 6px; margin-bottom: 12px; }
.daypick button { flex: 1; flex-direction: column; gap: 0; padding: 8px 0; min-height: 0; border-radius: 12px; font-size: 12px; color: var(--muted); }
.daypick button b { font-size: 18px; color: var(--ink); font-weight: 800; }
.daypick button em { font-style: normal; font-size: 11px; }
.daypick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.daypick button[aria-pressed="true"] b { color: var(--bg); }
.daypick button.today:not([aria-pressed="true"]) { border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.day { display: grid; gap: 8px; min-width: 0; }
.day > header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
.day > header b { font-size: 15px; font-weight: 800; }
.day > header span { color: var(--muted); font-size: 13px; font-weight: 600; }
.day.today > header b { color: var(--accent); }
.week .job { grid-template-columns: 34px minmax(0, 1fr); padding: 10px; gap: 10px; }
.week .job .ico { width: 34px; height: 34px; border-radius: 10px; }
.week .job .ico svg.i { width: 18px; height: 18px; }
.week .job .pill { grid-column: 2; justify-self: start; font-size: 11px; padding: 2px 8px; }
.week .jt { font-size: 14.5px; }
.week .js, .week .jm { font-size: 12.5px; }
.week .empty { padding: 14px 8px; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--tc); }
.legend svg.i { width: 16px; height: 16px; }

/* cards for units and crew */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; align-content: start; }
.card .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .uno { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.card .sub { color: var(--muted); font-size: 13.5px; }
.card .sub b { color: var(--ink); }
.progress { display: grid; gap: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; gap: 2px; }
.bar i { flex: 1; background: var(--line); }
.bar i.done { background: var(--ok); } .bar i.in_progress { background: var(--info); } .bar i.issue { background: var(--bad); }
.progress .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.late { color: var(--bad); } .ontime { color: var(--ok); }
.steps { display: grid; gap: 2px; }
.steps .st { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.steps .st:first-child { border-top: 0; }
.steps .dot { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.steps .dot svg.i { width: 15px; height: 15px; }
.steps .nm { min-width: 0; }
.steps .nm b { display: block; font-weight: 700; }
.steps .nm span { color: var(--muted); font-size: 12.5px; }
.steps .st.done .nm b { text-decoration: line-through; color: var(--muted); }
.steps .when { font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions > * { flex: 1 1 auto; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--tc); flex: none; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.who > div { min-width: 0; }
.who b { display: block; font-size: 16.5px; font-weight: 800; }
.who span { color: var(--tc); font-size: 13px; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; overflow-wrap: anywhere; user-select: all; font-weight: 700; }
.kv dd.none { color: var(--muted); font-weight: 500; user-select: none; }

/* floating add button (phones) */
.fab { display: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 6; border-radius: 999px; padding: 0 20px; min-height: 54px; font-size: 15px; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent); }

/* sheets */
.overlay { position: fixed; inset: 0; background: rgba(8,12,24,.55); z-index: 20; display: grid; place-items: start center; overflow-y: auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(720px, 100%); padding: 20px; display: grid; gap: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.narrow { width: min(460px, 100%); }
.modal h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .lab { font-size: 12.5px; color: var(--muted); font-weight: 700; }
input, select, textarea { font: 600 15px var(--font); padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); width: 100%; min-width: 0; min-height: 44px; }
textarea { min-height: 80px; resize: vertical; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; min-height: 0; }
.chip span { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; color: var(--muted); }
.chip svg.i { width: 17px; height: 17px; color: var(--tc); }
.chip input:checked + span { border-color: var(--tc); color: var(--ink); background: color-mix(in srgb, var(--tc) 12%, transparent); }
.chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip input:disabled + span { opacity: .6; }
.stepedit { display: grid; gap: 10px; }
.se { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.se .top { display: flex; align-items: center; gap: 10px; }
.se .top b { flex: 1; font-weight: 800; color: var(--tc); }
.se .top .ends { font-size: 13px; color: var(--muted); font-weight: 700; }
.se .row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 70px minmax(0, 1.2fr); gap: 8px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.note { font-size: 13px; color: var(--muted); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--bad); font-weight: 700; }
.msgbox { font: 500 14px/1.55 var(--font); min-height: 190px; }
.banner { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.desk { display: inline-flex; }

@media (max-width: 860px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; margin: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 0; }
  .nav button { flex: 1; flex-direction: column; gap: 3px; font-size: 11.5px; padding: 6px 2px; color: var(--muted); border-radius: 10px; }
  .nav button svg.i { width: 23px; height: 23px; }
  .nav button[aria-selected="true"] { background: transparent; color: var(--accent); }
  main { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .fab { display: inline-flex; }
  .desk { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .daypick { display: flex; }
  .week { grid-template-columns: 1fr; }
  .week .day:not(.sel) { display: none; }
  .week .day > header { display: none; }
  .week .job { grid-template-columns: 44px minmax(0, 1fr) auto; padding: 12px; gap: 12px; }
  .week .job .ico { width: 44px; height: 44px; border-radius: 12px; }
  .week .job .ico svg.i { width: 22px; height: 22px; }
  .week .job .pill { grid-column: auto; font-size: 12px; padding: 4px 10px; }
  .week .jt { font-size: 16px; } .week .js { font-size: 13.5px; } .week .jm { font-size: 13px; }
  .overlay { place-items: end center; padding: max(28px, env(safe-area-inset-top, 0px)) 0 0; }
  .modal, .modal.narrow { width: 100%; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .se .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .job, button, .chip span { transition: border-color .15s, background-color .15s, color .15s; }
  .modal { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<header class="band"><div class="wrap">
  <div class="brandrow">
    <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
    <div class="brand"><h1 id="greet">Make-Ready Board</h1><p id="today-line">Mon–Fri · 8:00 AM–5:00 PM</p></div>
    <nav class="nav" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" data-view="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
      <button role="tab" id="tab-week" data-view="week"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
      <button role="tab" id="tab-units" data-view="units"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M11 21v-3h2v3"/></svg>Units</button>
      <button role="tab" id="tab-crew" data-view="crew"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/></svg>Crew</button>
    </nav>
  </div>
  <section class="stats" id="stats" aria-label="Summary"></section>
</div></header>

<main class="wrap" id="app">
  <div id="banner" class="banner" hidden></div>

  <section id="view-today" hidden></section>

  <section id="view-week" hidden>
    <div class="weekbar">
      <button class="iconbtn" id="prev-week" aria-label="Previous week"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="week-label"></h2>
      <button class="iconbtn" id="next-week" aria-label="Next week"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="this-week">This week</button>
      <select id="crew-filter" aria-label="Show crew"></select>
      <button class="primary desk" data-act="new-unit">+ New turnover</button>
    </div>
    <div class="daypick" id="daypick"></div>
    <div class="week" id="week"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="view-units" hidden>
    <div class="sechead">
      <h2>Turnovers</h2>
      <label class="note" for="show-archived" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="show-archived" style="width:auto;min-height:0"> Show archived</label>
      <button class="primary desk" data-act="new-unit">+ New turnover</button>
    </div>
    <div class="cards" id="units"></div>
  </section>

  <section id="view-crew" hidden>
    <div class="sechead">
      <h2>Crew &amp; vendors</h2>
      <button class="primary" id="new-crew">+ Add crew or vendor</button>
    </div>
    <div class="cards" id="crew"></div>
  </section>
</main>
<button class="primary fab" data-act="new-unit" id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New turnover</button>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
  const ICONS = {
    turnover: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    paint: '<rect x="3" y="3" width="14" height="6" rx="1.5"/><path d="M17 6h3v5h-8v3"/><rect x="10.5" y="14" width="3" height="7" rx="1"/>',
    reglaze: '<path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V5a2 2 0 0 1 4 0"/><path d="M7 19l-1 2M17 19l1 2"/>',
    carpet_replace: '<circle cx="7" cy="9" r="4"/><circle cx="7" cy="9" r="1.2"/><path d="M7 13h14V5H7"/><path d="M11 17h10"/>',
    carpet_clean: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
    inspection: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/>',
  };
  const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ""}</svg>`;
  const TRADES = {
    turnover:       { label: "Turnover / repairs", short: "Turnover", days: () => 1 },
    paint:          { label: "Paint",              short: "Paint", days: b => (b >= 2 ? 2 : 1) },
    reglaze:        { label: "Tub reglaze",        short: "Reglaze", days: () => 1 },
    carpet_replace: { label: "Carpet replacement", short: "New carpet", days: () => 1 },
    carpet_clean:   { label: "Carpet cleaning",    short: "Carpet clean", days: () => 1 },
    inspection:     { label: "Final inspection",   short: "Inspection", days: () => 1 },
  };
  const ORDER = Object.keys(TRADES);
  const STATUS = { scheduled: "Scheduled", in_progress: "In progress", done: "Done", issue: "Issue" };
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // ---- dates (YYYY-MM-DD strings, local time, business days Mon–Fri) ----
  const pad = n => String(n).padStart(2, "0");
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const isBiz = d => d.getDay() !== 0 && d.getDay() !== 6;
  const nextBiz = s => { const d = parse(s); while (!isBiz(d)) d.setDate(d.getDate() + 1); return fmt(d); };
  const addBiz = (s, n) => { const d = parse(s); while (n > 0) { d.setDate(d.getDate() + 1); if (isBiz(d)) n--; } return fmt(d); };
  const endOf = st => addBiz(nextBiz(st.start), Math.max(1, st.days) - 1);
  const today = () => fmt(new Date());
  const mondayOf = s => { const d = parse(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return fmt(d); };
  const short = s => { if (!s) return "—"; const d = parse(s); return `${DOW[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`; };
  const long = s => { const d = parse(s); return `${DOWL[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
  const bizIndex = (start, day) => { let i = 1, s = nextBiz(start); while (s < day) { s = addBiz(s, 1); i++; } return i; };

  // Put each step on the next business day after the previous one ends.
  function schedule(steps, from) {
    let cur = nextBiz(from);
    for (const st of steps) { st.start = cur; cur = addBiz(endOf(st), 1); }
  }
  // After a manual change at index i, push later steps forward so nothing overlaps.
  function reflow(steps, i) {
    for (let k = i + 1; k < steps.length; k++) {
      const earliest = addBiz(endOf(steps[k - 1]), 1);
      if (!steps[k].start || steps[k].start < earliest) steps[k].start = earliest;
    }
  }

  // ---- state + storage (shared db when available, else this device) ----
  const t0 = today();
  const state = { units: [], crew: [], view: "today", week: mondayOf(nextBiz(t0)), day: nextBiz(t0), crewFilter: "", showArchived: false, ready: false };
  let db = null, canWrite = true;
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const local = {
    get(k) { try { return JSON.parse(localStorage.getItem("mrb-" + k) || "null"); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("mrb-" + k, JSON.stringify(v)); } catch {} },
  };
  async function put(coll, obj) {
    const { id, ...body } = obj;
    if (db) {
      try { await db.collection(coll).doc(id).set(body); }
      catch (e) { toast(e && e.code === "invalid_argument" ? "You have view-only access to this board." : "Couldn't save. Check your connection and try again."); throw e; }
    } else {
      const list = state[coll].filter(x => x.id !== id); list.push(obj); state[coll] = list; local.set(coll, list); render();
    }
  }
  async function remove(coll, id) {
    if (db) { try { await db.collection(coll).doc(id).delete(); } catch (e) { toast("Couldn't delete. Try again."); throw e; } }
    else { state[coll] = state[coll].filter(x => x.id !== id); local.set(coll, state[coll]); render(); }
  }
  function useLocal(reason) {
    state.units = local.get("units") || [];
    state.crew = local.get("crew") || [];
    state.ready = true;
    if (reason) { banner.textContent = reason; banner.hidden = false; }
    render();
  }
  async function boot() {
    const c = window.claude;
    if (!c || !c.use) { useLocal("Saving on this device only."); return; }
    db = await c.use("db");
    if (!db) { useLocal("Sign in to see the shared board. Changes you make now stay on this device."); return; }
    const user = await c.use("user");
    if (user && user.can) { try { const w = await user.can("data.write"); if (w === false) canWrite = false; } catch {} }
    let seen = 0;
    const done = () => { if (++seen >= 2) state.ready = true; render(); };
    for (const coll of ["units", "crew"]) {
      let first = true;
      db.collection(coll).onSnapshot(
        snap => { state[coll] = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (first) { first = false; done(); } else render(); },
        () => { banner.textContent = "Lost connection to the shared board. Reload the page to reconnect."; banner.hidden = false; }
      );
    }
  }

  // ---- helpers ----
  const $ = id => document.getElementById(id);
  const banner = $("banner");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const crewById = id => state.crew.find(c => c.id === id);
  const crewName = id => (crewById(id) || {}).name || "Unassigned";
  const initials = n => (n || "?").split(/\s+/).filter(w => /[A-Za-z0-9]/.test(w[0])).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "?";
  const projected = u => (u.steps.length ? endOf(u.steps[u.steps.length - 1]) : null);
  const unitDone = u => u.steps.length && u.steps.every(s => s.status === "done");
  const isLate = u => u.readyBy && projected(u) && projected(u) > u.readyBy && !unitDone(u);
  function unitStatus(u) {
    if (u.archived) return ["scheduled", "Archived"];
    if (unitDone(u)) return ["done", "Ready to rent"];
    if (u.steps.some(s => s.status === "issue")) return ["issue", "Has an issue"];
    if (u.steps.some(s => s.status === "in_progress" || s.status === "done")) return ["in_progress", "In progress"];
    return ["scheduled", "Scheduled"];
  }
  function jobsOn(day, filter = state.crewFilter) {
    const out = [];
    for (const u of state.units) {
      if (u.archived) continue;
      u.steps.forEach((s, i) => {
        if (!s.start) return;
        if (day >= nextBiz(s.start) && day <= endOf(s) && (!filter || s.crewId === filter)) out.push({ u, s, i, n: bizIndex(s.start, day) });
      });
    }
    return out.sort((a, b) => ORDER.indexOf(a.s.trade) - ORDER.indexOf(b.s.trade) || a.u.unit.localeCompare(b.u.unit, undefined, { numeric: true }));
  }
  const jobCard = ({ u, s, i, n }) => `
    <button class="job ${s.status === "done" ? "done" : ""} ${s.status === "issue" ? "issue" : ""}" style="--tc: var(--t-${s.trade})" data-act="step" data-unit="${esc(u.id)}" data-i="${i}">
      <span class="ico">${icon(s.trade)}</span>
      <span class="jb">
        <span class="jt">Unit ${esc(u.unit)}${u.building ? `<small>${esc(u.building)}</small>` : ""}</span>
        <span class="js">${esc(TRADES[s.trade].label)}${s.days > 1 && n ? ` · day ${n} of ${s.days}` : ""}</span>
        <span class="jm">${esc(crewName(s.crewId))}${s.note ? " · " + esc(s.note) : ""}</span>
      </span>
      <span class="pill s-${s.status}">${STATUS[s.status]}</span>
    </button>`;
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }

  // ---- render ----
  function render() {
    for (const v of ["today", "week", "units", "crew"]) { $("view-" + v).hidden = state.view !== v; $("tab-" + v).setAttribute("aria-selected", state.view === v); }
    document.querySelectorAll('[data-act="new-unit"], #new-crew').forEach(b => (b.hidden = !canWrite));
    $("fab").hidden = !canWrite || state.view === "crew";
    const h = new Date().getHours();
    $("greet").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    $("today-line").textContent = `${long(t0)} · Make-Ready Board · Mon–Fri 8–5`;
    renderStats();
    if (state.view === "today") renderToday();
    if (state.view === "week") renderWeek();
    if (state.view === "units") renderUnits();
    if (state.view === "crew") renderCrew();
  }
  function renderStats() {
    const active = state.units.filter(u => !u.archived && !unitDone(u));
    const jobs = jobsOn(nextBiz(t0), "").filter(j => j.s.status !== "done").length;
    const issues = state.units.filter(u => !u.archived).reduce((n, u) => n + u.steps.filter(s => s.status === "issue").length, 0);
    const late = active.filter(isLate).length;
    $("stats").innerHTML = `
      <div class="stat"><b>${active.length}</b><span>Units in turnover</span></div>
      <div class="stat"><b>${jobs}</b><span>Jobs left ${isBiz(parse(t0)) ? "today" : "Monday"}</span></div>
      <div class="stat ${issues ? "alert" : ""}"><b>${issues}</b><span>Issues</span></div>
      <div class="stat ${late ? "warnc" : ""}"><b>${late}</b><span>Running late</span></div>`;
  }
  function renderToday() {
    const day = nextBiz(t0), tomorrow = addBiz(day, 1);
    const label = day === t0 ? "Today" : "Next work day";
    const jobs = jobsOn(day, "");
    const issues = [];
    state.units.filter(u => !u.archived).forEach(u => u.steps.forEach((s, i) => { if (s.status === "issue") issues.push({ u, s, i }); }));
    const late = state.units.filter(u => !u.archived && isLate(u));
    const next = jobsOn(tomorrow, "");
    let html = `<section><div class="sechead"><h2>${label} · ${long(day)}</h2><span class="count">${jobs.length} job${jobs.length === 1 ? "" : "s"}</span></div>
      <div class="jobs">${jobs.length ? jobs.map(jobCard).join("") : `<div class="empty">${state.ready ? "Nothing scheduled. Tap <b>New turnover</b> when a unit is vacated." : "Loading your board…"}</div>`}</div></section>`;
    if (issues.length || late.length) {
      html += `<section><div class="sechead"><h2>Needs your attention</h2></div><div class="jobs">${issues.map(jobCard).join("")}${late.map(u => `
        <button class="job" style="--tc: var(--warn)" data-act="edit-unit" data-unit="${esc(u.id)}">
          <span class="ico"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="jb"><span class="jt">Unit ${esc(u.unit)}</span><span class="js">Finishes ${short(projected(u))}, ready-by is ${short(u.readyBy)}</span><span class="jm">Tap to reschedule</span></span>
          <span class="pill s-late">Late</span></button>`).join("")}</div></section>`;
    }
    html += `<section><div class="sechead"><h2>Coming up · ${long(tomorrow)}</h2><span class="count">${next.length} job${next.length === 1 ? "" : "s"}</span></div>
      <div class="jobs">${next.length ? next.map(jobCard).join("") : `<div class="empty">Nothing scheduled yet.</div>`}</div></section>`;
    $("view-today").innerHTML = html;
  }
  function renderWeek() {
    const sel = $("crew-filter");
    sel.innerHTML = `<option value="">All crews</option>` + [...state.crew].sort((a, b) => ORDER.indexOf(a.trade) - ORDER.indexOf(b.trade))
      .map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    sel.value = state.crewFilter;
    const end = addBiz(state.week, 4);
    const ws = parse(state.week), we = parse(end);
    $("week-label").textContent = `${MON[ws.getMonth()]} ${ws.getDate()} – ${ws.getMonth() === we.getMonth() ? "" : MON[we.getMonth()] + " "}${we.getDate()}`;
    if (state.day < state.week || state.day > end) state.day = state.week;
    let cols = "", picks = "";
    for (let i = 0, d = state.week; i < 5; i++, d = addBiz(d, 1)) {
      const jobs = jobsOn(d), pd = parse(d);
      picks += `<button aria-pressed="${d === state.day}" class="${d === t0 ? "today" : ""}" data-day="${d}">${DOW[pd.getDay()]}<b>${pd.getDate()}</b><em>${jobs.length ? jobs.length + " job" + (jobs.length > 1 ? "s" : "") : "—"}</em></button>`;
      cols += `<div class="day ${d === t0 ? "today" : ""} ${d === state.day ? "sel" : ""}"><header><b>${DOW[pd.getDay()]}${d === t0 ? " · Today" : ""}</b><span>${pd.getMonth() + 1}/${pd.getDate()}</span></header>`;
      cols += jobs.length ? jobs.map(jobCard).join("") : `<div class="empty">${state.ready ? "Nothing scheduled" : "Loading…"}</div>`;
      cols += `</div>`;
    }
    $("daypick").innerHTML = picks;
    $("week").innerHTML = cols;
    $("legend").innerHTML = ORDER.map(k => `<span style="--tc: var(--t-${k})">${icon(k)}${TRADES[k].label}</span>`).join("");
  }
  function renderUnits() {
    $("show-archived").checked = state.showArchived;
    const list = state.units.filter(u => state.showArchived || !u.archived)
      .sort((a, b) => (a.archived - b.archived) || (a.readyBy || "9").localeCompare(b.readyBy || "9"));
    if (!list.length) {
      $("units").innerHTML = `<div class="empty">${state.ready ? "No turnovers yet. Tap <b>New turnover</b> when a unit is vacated and the board schedules each trade in order for you." : "Loading…"}</div>`;
      return;
    }
    $("units").innerHTML = list.map(u => {
      const [sk, sl] = unitStatus(u);
      const p = projected(u), doneN = u.steps.filter(s => s.status === "done").length;
      return `<article class="card">
        <div class="head"><span class="uno">Unit ${esc(u.unit)}</span><span class="pill s-${sk}">${sl}</span></div>
        <div class="sub">${u.building ? esc(u.building) + " · " : ""}${u.bedrooms === 0 ? "Studio" : esc(u.bedrooms) + " bed"} · Moved out ${short(u.moveOut)}</div>
        <div class="progress">
          <div class="bar">${u.steps.map(s => `<i class="${s.status}"></i>`).join("")}</div>
          <div class="lbl"><span>${doneN} of ${u.steps.length} done</span><span class="${isLate(u) ? "late" : "ontime"}">${unitDone(u) ? "Ready" : `Done ${short(p)}`} · due ${short(u.readyBy)}</span></div>
        </div>
        <div class="steps">${u.steps.map((s, i) => `<div class="st ${s.status === "done" ? "done" : ""}" style="--tc: var(--t-${s.trade})"><span class="dot">${icon(s.trade)}</span><span class="nm"><b>${esc(TRADES[s.trade].label)}</b><span>${esc(crewName(s.crewId))}</span></span><span class="when">${short(nextBiz(s.start))}${s.days > 1 ? "–" + short(endOf(s)).split(" ")[1] : ""}</span></div>`).join("")}</div>
        ${u.notes ? `<div class="sub">${esc(u.notes)}</div>` : ""}
        ${canWrite ? `<div class="actions"><button data-act="edit-unit" data-unit="${esc(u.id)}">Edit / reschedule</button><button class="ghost" data-act="archive" data-unit="${esc(u.id)}">${u.archived ? "Restore" : "Archive"}</button></div>` : ""}
      </article>`;
    }).join("");
  }
  function renderCrew() {
    if (!state.crew.length) {
      $("crew").innerHTML = `<div class="empty">${state.ready ? "Add your painter, carpet, reglaze and cleaning vendors and your in-house techs. Each one gets a weekly schedule message you can text or email." : "Loading…"}</div>`;
      return;
    }
    const list = [...state.crew].sort((a, b) => ORDER.indexOf(a.trade) - ORDER.indexOf(b.trade));
    $("crew").innerHTML = list.map(c => {
      const count = state.units.filter(u => !u.archived).reduce((n, u) => n + u.steps.filter(s => s.crewId === c.id && s.status !== "done").length, 0);
      return `<article class="card" style="--tc: var(--t-${c.trade})">
        <div class="head"><div class="who"><span class="avatar">${esc(initials(c.name))}</span><div><b>${esc(c.name)}</b><span>${esc(TRADES[c.trade]?.label || c.trade)}</span></div></div>
          <span class="pill s-${count ? "in_progress" : "scheduled"}">${count} open job${count === 1 ? "" : "s"}</span></div>
        <dl class="kv">
          <dt>Type</dt><dd style="user-select:none">${c.type === "vendor" ? "Outside vendor" : "In-house"}${c.company ? " · " + esc(c.company) : ""}</dd>
          <dt>Mobile</dt><dd class="${c.phone ? "" : "none"}">${esc(c.phone || "Not added yet")}</dd>
          <dt>Email</dt><dd class="${c.email ? "" : "none"}">${esc(c.email || "Not added yet")}</dd>
        </dl>
        <div class="actions"><button class="primary" data-act="message" data-crew="${esc(c.id)}">Send week schedule</button>${canWrite ? `<button data-act="edit-crew" data-crew="${esc(c.id)}">Edit</button>` : ""}</div>
      </article>`;
    }).join("");
  }

  // ---- sheets ----
  const overlay = $("overlay");
  function openModal(html, cls = "") { overlay.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`; overlay.hidden = false; const f = overlay.querySelector("input:not([type=checkbox]):not([type=radio]), select, textarea"); f && f.focus({ preventScroll: true }); }
  function closeModal() { overlay.hidden = true; overlay.innerHTML = ""; }
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closeModal(); });
  const crewOptions = (trade, sel) => {
    const fit = state.crew.filter(c => c.trade === trade), other = state.crew.filter(c => c.trade !== trade);
    return `<option value="">Unassigned</option>` + fit.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("") +
      (other.length ? `<optgroup label="Other trades">${other.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>` : "");
  };
  const chip = (type, name, val, k, on, text) => `<label class="chip" style="--tc: var(--t-${k})"><input type="${type}" name="${name}" value="${val}" ${on ? "checked" : ""}><span>${icon(k)}${text}</span></label>`;

  // Unit editor: pick the work, the board lays out dates in the standard order.
  function unitEditor(existing) {
    const t = today();
    const u = existing ? structuredClone(existing) : { id: uid(), unit: "", building: "", bedrooms: 1, moveOut: t, readyBy: addBiz(t, 7), notes: "", steps: [], archived: false };
    function newStep(k, b) { const pref = state.crew.filter(c => c.trade === k); return { trade: k, crewId: pref[0]?.id || "", days: TRADES[k].days(b), start: "", status: "scheduled", note: "" }; }
    if (!existing) { for (const k of ["turnover", "paint", "carpet_clean", "inspection"]) u.steps.push(newStep(k, u.bedrooms)); schedule(u.steps, addBiz(u.moveOut, 1)); }
    const has = k => u.steps.some(s => s.trade === k);
    const carpet = has("carpet_replace") ? "replace" : has("carpet_clean") ? "clean" : "none";
    openModal(`
      <h2>${existing ? "Unit " + esc(u.unit) : "New turnover"}</h2>
      <div class="grid2">
        <label class="field"><span>Unit #</span><input id="f-unit" value="${esc(u.unit)}" placeholder="e.g. 204" inputmode="text"></label>
        <label class="field"><span>Building</span><input id="f-building" value="${esc(u.building)}" placeholder="Optional"></label>
        <label class="field"><span>Bedrooms</span><select id="f-bed">${[0, 1, 2, 3, 4].map(n => `<option value="${n}" ${u.bedrooms === n ? "selected" : ""}>${n === 0 ? "Studio" : n + " bed"}</option>`).join("")}</select></label>
        <label class="field"><span>Move-out</span><input type="date" id="f-moveout" value="${esc(u.moveOut)}"></label>
        <label class="field"><span>Ready by</span><input type="date" id="f-ready" value="${esc(u.readyBy)}"></label>
      </div>
      <div class="field"><span class="lab">Work needed</span><div class="chips" id="work">
        ${chip("checkbox", "w", "turnover", "turnover", has("turnover"), "Turnover")}
        ${chip("checkbox", "w", "paint", "paint", has("paint"), "Paint")}
        ${chip("checkbox", "w", "reglaze", "reglaze", has("reglaze"), "Tub reglaze")}
        ${chip("checkbox", "w", "inspection", "inspection", has("inspection"), "Inspection")}
      </div></div>
      <div class="field"><span class="lab">Carpet</span><div class="chips" id="carpet">
        ${chip("radio", "carpet", "replace", "carpet_replace", carpet === "replace", "Replace")}
        ${chip("radio", "carpet", "clean", "carpet_clean", carpet === "clean", "Clean")}
        ${chip("radio", "carpet", "none", "inspection", carpet === "none", "None")}
      </div></div>
      <div class="foot"><span class="lab">Schedule</span><button class="ghost" id="auto">Auto-schedule from move-out</button></div>
      <div class="stepedit" id="steps"></div>
      <div class="note">Trades run in order with weekends skipped. Change a start date and the trades after it move back to fit.</div>
      <label class="field"><span>Notes</span><textarea id="f-notes" placeholder="Gate code, damage found, keys, etc.">${esc(u.notes)}</textarea></label>
      <div class="foot"><span id="del-zone">${existing ? `<button class="danger ghost" id="del">Delete</button>` : ""}</span><span class="actions"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></span></div>`);
    const body = $("steps");
    const paint = () => {
      body.innerHTML = u.steps.map((s, i) => `<div class="se" style="--tc: var(--t-${s.trade})">
        <div class="top"><span class="ico" style="width:32px;height:32px;border-radius:9px">${icon(s.trade)}</span><b>${TRADES[s.trade].label}</b><span class="ends">${s.start ? short(nextBiz(s.start)) + (s.days > 1 ? " – " + short(endOf(s)) : "") : ""}</span></div>
        <div class="row">
          <label class="field"><span>Crew</span><select data-k="crewId" data-i="${i}">${crewOptions(s.trade, s.crewId)}</select></label>
          <label class="field"><span>Start</span><input type="date" data-k="start" data-i="${i}" value="${esc(s.start)}"></label>
          <label class="field"><span>Days</span><input type="number" min="1" max="10" data-k="days" data-i="${i}" value="${s.days}"></label>
          <label class="field"><span>Status</span><select data-k="status" data-i="${i}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${s.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        </div></div>`).join("") || `<div class="empty">Pick the work needed above.</div>`;
      const p = projected(u), rb = $("f-ready").value;
      $("save").textContent = p && rb && p > rb ? `Save (done ${short(p)}, late)` : "Save";
    };
    const rebuild = () => {
      const cv = overlay.querySelector('input[name="carpet"]:checked').value;
      const want = ORDER.filter(k => k.startsWith("carpet") ? cv === k.slice(7) : overlay.querySelector(`#work input[value="${k}"]`).checked);
      const old = u.steps;
      u.steps = want.map(k => old.find(s => s.trade === k) || newStep(k, Number($("f-bed").value)));
      if (u.steps[0] && !u.steps[0].start) u.steps[0].start = addBiz($("f-moveout").value || t, 1);
      for (let i = 0; i < u.steps.length - 1; i++) reflow(u.steps, i);
      paint();
    };
    overlay.querySelectorAll(".chips input").forEach(el => el.addEventListener("change", rebuild));
    $("f-bed").addEventListener("change", () => { const b = Number($("f-bed").value); u.steps.forEach(s => { if (s.status === "scheduled") s.days = TRADES[s.trade].days(b); }); for (let i = 0; i < u.steps.length - 1; i++) reflow(u.steps, i); paint(); });
    $("f-ready").addEventListener("change", paint);
    $("auto").addEventListener("click", () => { schedule(u.steps, addBiz($("f-moveout").value || t, 1)); paint(); toast("Scheduled from move-out date"); });
    body.addEventListener("change", e => {
      const el = e.target, i = Number(el.dataset.i), k = el.dataset.k; if (!k) return;
      u.steps[i][k] = k === "days" ? Math.max(1, Number(el.value) || 1) : el.value;
      if (k === "start" && el.value) u.steps[i].start = nextBiz(el.value);
      if (k === "start" || k === "days") reflow(u.steps, i);
      paint();
    });
    $("cancel").addEventListener("click", closeModal);
    const del = $("del");
    if (del) del.addEventListener("click", () => {
      $("del-zone").innerHTML = `<span class="confirm">Delete Unit ${esc(u.unit)}? <button class="danger" id="del-yes">Delete</button><button id="del-no">Keep</button></span>`;
      $("del-yes").addEventListener("click", async () => { await remove("units", u.id); closeModal(); toast(`Deleted Unit ${u.unit}`); });
      $("del-no").addEventListener("click", () => { $("del-zone").innerHTML = ""; });
    });
    $("save").addEventListener("click", async () => {
      u.unit = $("f-unit").value.trim(); u.building = $("f-building").value.trim(); u.bedrooms = Number($("f-bed").value);
      u.moveOut = $("f-moveout").value; u.readyBy = $("f-ready").value; u.notes = $("f-notes").value.trim();
      if (!u.unit) { $("f-unit").focus(); toast("Enter a unit number."); return; }
      if (!u.steps.length) { toast("Pick at least one kind of work."); return; }
      if (u.steps.some(s => !s.start)) schedule(u.steps, addBiz(u.moveOut || t, 1));
      u.updated = new Date().toISOString();
      await put("units", u); closeModal(); toast(`Saved Unit ${u.unit}`);
    });
    paint();
  }

  function stepEditor(unitId, i) {
    const u = state.units.find(x => x.id === unitId); if (!u) return;
    const s = u.steps[i];
    const c = crewById(s.crewId);
    openModal(`
      <div class="who" style="--tc: var(--t-${s.trade})"><span class="ico">${icon(s.trade)}</span><div><b style="font-size:20px">Unit ${esc(u.unit)}</b><span>${esc(TRADES[s.trade].label)}</span></div></div>
      <dl class="kv">
        <dt>Crew</dt><dd style="user-select:none">${esc(crewName(s.crewId))}</dd>
        ${c && c.phone ? `<dt>Mobile</dt><dd>${esc(c.phone)}</dd>` : ""}
        <dt>When</dt><dd style="user-select:none">${short(nextBiz(s.start))}${s.days > 1 ? " – " + short(endOf(s)) : ""}</dd>
      </dl>
      <div class="field"><span class="lab">Status</span><div class="chips">${Object.entries(STATUS).map(([k, v]) => `<label class="chip" style="--tc: var(--${k === "done" ? "ok" : k === "issue" ? "bad" : k === "in_progress" ? "info" : "idle"})"><input type="radio" name="st" value="${k}" ${s.status === k ? "checked" : ""} ${canWrite ? "" : "disabled"}><span>${v}</span></label>`).join("")}</div></div>
      <label class="field"><span>Note</span><textarea id="s-note" ${canWrite ? "" : "disabled"} placeholder="e.g. Needs second coat, tub chipped, waiting on carpet delivery">${esc(s.note)}</textarea></label>
      <div class="foot">${canWrite ? `<button class="ghost" data-act="edit-unit" data-unit="${esc(u.id)}">Reschedule…</button>` : "<span></span>"}<span class="actions"><button id="cancel">Close</button>${canWrite ? `<button class="primary" id="save">Save</button>` : ""}</span></div>`, "narrow");
    $("cancel").addEventListener("click", closeModal);
    const save = $("save");
    if (save) save.addEventListener("click", async () => {
      const nu = structuredClone(u);
      nu.steps[i].status = overlay.querySelector('input[name="st"]:checked').value;
      nu.steps[i].note = $("s-note").value.trim();
      nu.updated = new Date().toISOString();
      await put("units", nu); closeModal(); toast(`Unit ${u.unit}: ${TRADES[s.trade].short} marked ${STATUS[nu.steps[i].status].toLowerCase()}`);
    });
  }

  function crewEditor(existing) {
    const c = existing ? { ...existing } : { id: uid(), name: "", company: "", trade: "paint", type: "vendor", phone: "", email: "" };
    openModal(`
      <h2>${existing ? "Edit " + esc(c.name) : "Add crew or vendor"}</h2>
      <div class="grid2">
        <label class="field"><span>Name</span><input id="c-name" value="${esc(c.name)}" placeholder="Person or crew name"></label>
        <label class="field"><span>Company</span><input id="c-company" value="${esc(c.company || "")}" placeholder="Optional"></label>
        <label class="field"><span>Trade</span><select id="c-trade">${ORDER.map(k => `<option value="${k}" ${c.trade === k ? "selected" : ""}>${TRADES[k].label}</option>`).join("")}</select></label>
        <label class="field"><span>Type</span><select id="c-type"><option value="inhouse" ${c.type === "inhouse" ? "selected" : ""}>In-house</option><option value="vendor" ${c.type === "vendor" ? "selected" : ""}>Outside vendor</option></select></label>
        <label class="field"><span>Mobile (for texts)</span><input id="c-phone" type="tel" value="${esc(c.phone)}" placeholder="555-123-4567"></label>
        <label class="field"><span>Email</span><input id="c-email" type="email" value="${esc(c.email)}" placeholder="name@company.com"></label>
      </div>
      <div class="foot"><span id="del-zone">${existing ? `<button class="danger ghost" id="del">Remove</button>` : ""}</span><span class="actions"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></span></div>`, "narrow");
    $("cancel").addEventListener("click", closeModal);
    const del = $("del");
    if (del) del.addEventListener("click", () => {
      $("del-zone").innerHTML = `<span class="confirm">Remove ${esc(c.name)}? Their jobs become unassigned. <button class="danger" id="del-yes">Remove</button><button id="del-no">Keep</button></span>`;
      $("del-yes").addEventListener("click", async () => { await remove("crew", c.id); closeModal(); toast(`Removed ${c.name}`); });
      $("del-no").addEventListener("click", () => { $("del-zone").innerHTML = ""; });
    });
    $("save").addEventListener("click", async () => {
      c.name = $("c-name").value.trim(); c.company = $("c-company").value.trim(); c.trade = $("c-trade").value; c.type = $("c-type").value;
      c.phone = $("c-phone").value.trim(); c.email = $("c-email").value.trim();
      if (!c.name) { $("c-name").focus(); toast("Enter a name."); return; }
      await put("crew", c); closeModal(); toast(`Saved ${c.name}`);
    });
  }

  function weekMessage(crewId) {
    const c = crewById(crewId); if (!c) return;
    const lines = [];
    for (let i = 0, d = state.week; i < 5; i++, d = addBiz(d, 1)) {
      for (const u of state.units) {
        if (u.archived) continue;
        u.steps.forEach(s => {
          if (s.crewId !== crewId || !s.start || s.status === "done") return;
          if (d >= nextBiz(s.start) && d <= endOf(s)) lines.push(`${short(d)} – Unit ${u.unit}${u.building ? " (" + u.building + ")" : ""}: ${TRADES[s.trade].label}${s.days > 1 ? ` (day ${bizIndex(s.start, d)} of ${s.days})` : ""}`);
        });
      }
    }
    const first = c.name.split(" ")[0];
    const text = lines.length
      ? `Hi ${first}, here is your schedule for the week of ${short(state.week)}:\n${lines.join("\n")}\nHours are 8am–5pm, Mon–Fri. Please reply to confirm, and text me right away if anything holds you up. Thanks!`
      : `Hi ${first}, nothing is on your schedule for the week of ${short(state.week)} yet. I'll reach out when a unit is ready for you. Thanks!`;
    const subj = `Make-ready schedule, week of ${short(state.week)}`;
    openModal(`
      <div class="who" style="--tc: var(--t-${c.trade})"><span class="avatar">${esc(initials(c.name))}</span><div><b style="font-size:19px">Message for ${esc(c.name)}</b><span>Week of ${short(state.week)}</span></div></div>
      <textarea class="msgbox" id="msg" readonly>${esc(text)}</textarea>
      <dl class="kv"><dt>Mobile</dt><dd class="${c.phone ? "" : "none"}">${esc(c.phone || "Not added yet")}</dd><dt>Email</dt><dd class="${c.email ? "" : "none"}">${esc(c.email || "Not added yet")}</dd></dl>
      <div class="actions">
        <button class="primary" id="copy">Copy message</button>
        ${c.phone ? `<a class="btn" href="sms:${esc(c.phone.replace(/[^\d+]/g, ""))}?&body=${encodeURIComponent(text)}" target="_blank" rel="noopener">Text</a>` : ""}
        ${c.email ? `<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(text)}" target="_blank" rel="noopener">Email</a>` : ""}
        <button id="cancel">Close</button>
      </div>
      <div class="note">If Text or Email doesn't open on your device, tap Copy and paste the message into your texting or email app. Use the Week tab to pick a different week.</div>`, "narrow");
    $("cancel").addEventListener("click", closeModal);
    $("copy").addEventListener("click", () => {
      const m = $("msg");
      navigator.clipboard.writeText(text).then(() => toast("Message copied"), () => { m.focus(); m.select(); toast("Press and hold to copy the message"); });
    });
  }

  // ---- events ----
  document.querySelector(".nav").addEventListener("click", e => { const v = e.target.closest("[data-view]")?.dataset.view; if (v) { state.view = v; try { localStorage.setItem("mrb-view", v); } catch {} render(); window.scrollTo(0, 0); } });
  const shiftWeek = n => { const d = parse(state.week); d.setDate(d.getDate() + 7 * n); state.week = fmt(d); state.day = state.week; render(); };
  $("prev-week").addEventListener("click", () => shiftWeek(-1));
  $("next-week").addEventListener("click", () => shiftWeek(1));
  $("this-week").addEventListener("click", () => { state.week = mondayOf(nextBiz(today())); state.day = nextBiz(today()); render(); });
  $("daypick").addEventListener("click", e => { const d = e.target.closest("[data-day]")?.dataset.day; if (d) { state.day = d; render(); } });
  $("crew-filter").addEventListener("change", e => { state.crewFilter = e.target.value; render(); });
  $("show-archived").addEventListener("change", e => { state.showArchived = e.target.checked; render(); });
  $("new-crew").addEventListener("click", () => crewEditor());
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "new-unit") unitEditor();
    if (a === "edit-unit") { const u = state.units.find(x => x.id === b.dataset.unit); if (u) unitEditor(u); }
    if (a === "step") stepEditor(b.dataset.unit, Number(b.dataset.i));
    if (a === "edit-crew") crewEditor(crewById(b.dataset.crew));
    if (a === "message") weekMessage(b.dataset.crew);
    if (a === "archive") { const u = state.units.find(x => x.id === b.dataset.unit); if (u) { await put("units", { ...u, archived: !u.archived }); toast(u.archived ? `Restored Unit ${u.unit}` : `Archived Unit ${u.unit}`); } }
  });

  try { const v = localStorage.getItem("mrb-view"); if (v && ["today", "week", "units", "crew"].includes(v)) state.view = v; } catch {}
  render();
  boot();
})();
</script>
